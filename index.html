<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oddity Realm</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================================
         LANDING
         ========================================= -->

    <main class="landing" id="landing">

        <header class="top-bar">

            <div class="realm-mark">
                ODDITY REALM
            </div>

            <button class="enter-link" id="enterHint">
                ENTER ↗
            </button>

        </header>


        <section class="hero">

            <img
                src="images/oddity-symbol.png"
                alt="Oddity symbol"
                class="oddity-symbol"
            >

            <div class="realm-title">

                <span>ODDITY</span>
                <span>REALM</span>

            </div>


            <p class="subtitle">
                a collection of strange things
            </p>

        </section>


        <button class="curious" id="curiousButton">
            CURIOUS?
        </button>

    </main>


    <!-- =========================================
         FIRST ARTWORK
         ========================================= -->

    <section class="artwork-screen" id="artworkScreen">

        <div class="artwork-frame">

            <img
                src="images/first-painting.jpg"
                alt="Artwork"
                class="first-artwork"
                id="firstArtwork"
            >

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
